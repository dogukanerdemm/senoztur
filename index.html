<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senoz Tur & Doğa Macerası | Az Sabret Uşağum!</title>
    <style>
        /* Temel Ayarlar */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Permanent+Marker&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #2c3e2d; /* Koyu yeşil */
            color: #ffffff;
            overflow: hidden; /* Kaydırma çubuğunu gizle */
        }

        /* Arka Plan Görseli */
        .bg-image {
            /* BURAYA ÖNCEKİ TURDA OLUŞTURDUĞUMUZ GÖRSELİN DOSYA ADINI YAZIN */
            background-image: url('senoz_gorsel_yakinda.jpg'); 
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: absolute;
            width: 100%;
            z-index: 1;
            /* Hafif karanlıklaştırma efekti text okunurluğu için */
            filter: brightness(70%);
        }

        /* İçerik Konteyneri */
        .content-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        /* Esprili Şiveli İçerik Kutusu */
        .coming-soon-box {
            background: rgba(0, 0, 0, 0.6); /* Şeffaf siyah */
            backdrop-filter: blur(8px); /* Cam efekti */
            padding: 40px 60px;
            border-radius: 20px;
            border: 2px solid #8e44ad; /* Hafif bir morluk/altın tonu */
            text-align: center;
            max-width: 700px;
            margin: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Permanent Marker', cursive; /* El yazısı/Rustic font */
            font-size: 3rem;
            color: #f1c40f; /* Sıcak sarı */
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #bdc3c7;
            margin-bottom: 30px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #ecf0f1;
        }

        /* Şiveli Vurgular */
        .shive-vurgu {
            font-weight: 700;
            color: #2ecc71; /* Canlı yeşil */
        }

        /* İletişim Butonu */
        .btn-iletisim {
            display: inline-block;
            padding: 12px 30px;
            background-color: #f1c40f;
            color: #2c3e2d;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 25px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-iletisim:hover {
            transform: scale(1.05);
            background-color: #e67e22; /* Daha koyu sarı/turuncu */
        }

        /* Alt Bilgi */
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* Mobil Uyumluluk */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .content-overlay { padding: 10px; }
            .coming-soon-box { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="content-overlay">
        
    </div>

</body>
</html>
