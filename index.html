<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Senozderesi Tur | Çok Yakında</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background: #163c28;
            font-family: Arial, Helvetica, sans-serif;
        }

        .coming-soon {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #163c28;
        }

        .coming-soon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
        }

        /* Mobil cihazlarda görselin önemli kısmını koru */
        @media (max-width: 768px) {

            .coming-soon {
                height: 100dvh;
            }

            .coming-soon img {
                object-fit: cover;
                object-position: center center;
            }
        }
    </style>
</head>

<body>

    <div class="coming-soon">
        <img src="senozderesi-yakinda.png"
             alt="Senozderesi Tur - Rize Çayeli">
    </div>

</body>
</html>
